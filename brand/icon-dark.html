<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent}
  .d{position:absolute;top:0;left:0;border-radius:50%;background:#141413;display:grid;place-items:center}
  img{display:block}
</style></head>
<body><div class="d" id="d"><img id="m" src="mark.svg" alt=""></div><script>
// ?s=128 renders the mark on a black disc at 128px, the same disc the brandmark uses in the UI.
const s=+new URLSearchParams(location.search).get('s')||128;
const d=document.getElementById('d'); d.style.width=d.style.height=s+'px';
const m=document.getElementById('m'); m.width=m.height=Math.round(s*0.94);
</script></body></html>
