<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sizer store frames</title>
  <!-- Store and launch imagery. ?n=1..4 picks the frame, ?kind=promo|marquee renders the tiles. -->
  <link rel="stylesheet" href="../ui/fonts.css">
  <style>
    :root {
      --ecru: #F6F3EC; --graphite: #1C1B18; --muted: #5F5B52; --hair: #DDD7CA; --loden: #2F4A3A;
      --serif: "Jost", "Avenir Next", "Futura", "Century Gothic", -apple-system, "Segoe UI", sans-serif;
      --sans: "Instrument Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    }
    html, body { margin: 0; background: var(--ecru); color: var(--graphite); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    .frame { width: 1280px; height: 800px; display: grid; grid-template-columns: 380px 724px; gap: 48px; align-items: center; padding: 0 64px; box-sizing: border-box; overflow: hidden; }
    .mark { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--loden); overflow: hidden; vertical-align: middle; }
    .mark img { width: 28px; height: 28px; display: block; }
    .word { font: 500 18px/1 var(--serif); letter-spacing: .01em; margin-left: 10px; vertical-align: middle; }
    h1 { font: 500 50px/1.04 var(--serif); letter-spacing: -.02em; margin: 34px 0 18px; text-wrap: balance; }
    p { margin: 0; font-size: 18px; color: var(--muted); max-width: 360px; }
    .window { width: 724px; height: 640px; background: #fff; border-radius: 14px; box-shadow: 0 30px 80px rgba(28, 27, 24, .18), 0 0 0 1px rgba(28, 27, 24, .06); overflow: hidden; position: relative; }
    .chrome { height: 38px; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0 16px; gap: 10px; font-size: 12px; color: #8a8a8a; }
    .url { flex: 1; height: 22px; border-radius: 11px; background: #f3f3f3; display: flex; align-items: center; padding: 0 12px; }
    iframe, .window img { border: 0; width: 1180px; height: 981px; transform: scale(.6136); transform-origin: 0 0; position: absolute; top: 38px; left: 0; }

    .tile { width: 440px; height: 280px; background: var(--loden); color: var(--ecru); display: flex; flex-direction: column; justify-content: center; padding: 0 40px; box-sizing: border-box; }
    .tile .logo { width: 72px; height: 72px; display: block; }
    .marquee .logo { width: 120px; height: 120px; }
    .tile .t { font: 500 34px/1.08 var(--serif); letter-spacing: -.015em; margin-top: 22px; }
    .marquee { width: 1400px; height: 560px; padding: 0 110px; }
    .marquee .t { font-size: 64px; max-width: 900px; }
    .marquee .sub { font-size: 21px; opacity: .8; margin-top: 18px; max-width: 760px; }
  </style>
</head>
<body>
  <script>
    const q = new URLSearchParams(location.search);
    const FRAMES = {
      1: ['Your size, right under the size picker.', 'Sizer reads the brand, the fabric and the fit notes, then tells you which size to pick.', '../tests/fixture-shop.html?picker-open=1', 'demo-shop.example/jeans'],
      2: ['Every answer shows its working.', 'Your sizes, the brand’s chart, the stretch and the page’s own fit notes, in plain words.', '../tests/fixture-shop.html?open=why', 'demo-shop.example/jeans'],
      3: ['Sold out? It says what’s close.', 'When your size is gone, Sizer names the nearest sizes in stock and how far off they are.', '../tests/fixture-shop.html?stock=out&picker-open=1', 'demo-shop.example/jeans'],
      4: ['Set up once, in under a minute.', 'Add your measurements, clothes that already fit, or both. Everything stays in your browser.', 'out/_options.png', 'Sizer · Your fit profile'],
    };
    const kind = q.get('kind');
    if (kind === 'promo' || kind === 'marquee') {
      document.write(`<div class="tile ${kind === 'marquee' ? 'marquee' : ''}"><img class="logo" src="../brand/logo.png" alt="">
        <div class="t">Your size, on every product page.</div>
        ${kind === 'marquee' ? '<div class="sub">Sizer reads the brand, the fabric and the fit notes, and puts your size under the size picker.</div>' : ''}</div>`);
    } else {
      const [title, sub, src, url] = FRAMES[q.get('n') || 1];
      document.write(`<div class="frame">
        <div><span class="mark"><img src="../brand/mark.svg" alt=""></span><span class="word">sizer</span><h1>${title}</h1><p>${sub}</p></div>
        <div class="window"><div class="chrome"><div class="url">${url}</div></div>${src.endsWith('.png') ? `<img src="${src}" alt="">` : `<iframe src="${src}" title="Preview"></iframe>`}</div>
      </div>`);
    }
  </script>
</body>
</html>
