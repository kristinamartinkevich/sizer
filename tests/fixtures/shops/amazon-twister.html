<!doctype html>
<!--
  Synthetic fixture (found shopping on Amazon UK, 2026-10-12): Amazon's product page opens with a hidden
  h1 ("Product summary presents key product information"), puts the real title in span#productTitle
  and the brand in a#bylineInfo ("Visit the Kestrel Store"), and lists sizes in a select whose
  options read "28W / 30L", a sold-out one classed dropdownUnavailable. A hidden "report a lower
  price" form holds day and month selects (01 to 31), which read as sizes. Sizer took the hidden
  heading for the title and sized a pair of jeans on "01" to "31". Markup trimmed from Amazon's
  product page; the brand is fictional.
-->
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <title>Kestrel Women's 501 Original Jeans : Amazon.co.uk: Fashion</title>
  <style>
    body { font: 14px/1.4 Arial, sans-serif; margin: 0; color: #0f1111; }
    #dp { max-width: 1200px; margin: 0 auto; padding: 16px; }
    #pqv-hidden-ingress { position: absolute; left: -9999px; }
    .a-popover-preload { display: none; }
    #productTitle { font-size: 24px; }
  </style>
</head>
<body>
  <div id="dp" class="apparel en_GB">
    <div id="pqv-hidden-ingress" class="a-section a-padding-base desktop-ingress">
      <h1 id="pqv-ingress" class="a-size-base a-text-normal has-opt-key">Product summary presents key product information</h1>
    </div>
    <div id="centerCol">
      <div id="titleSection"><h1 id="title" class="a-size-medium a-spacing-none"><span id="productTitle" class="a-size-large product-title-word-break">   Kestrel Women's 501 Original Jeans   </span></h1></div>
      <div id="bylineInfo_feature_div"><a id="bylineInfo" class="a-link-normal" href="/stores/Kestrel/page/1">Visit the Kestrel Store</a></div>
      <div id="corePrice_feature_div"><span class="a-price"><span class="a-offscreen">£45.00</span></span></div>
      <div id="twister_feature_div">
        <div id="variation_size_name" class="a-section a-spacing-base variation-dropdown">
          <label class="a-form-label">Size:</label>
          <span class="a-dropdown-container">
            <select name="dropdown_selected_size_name" id="native_dropdown_selected_size_name" class="a-native-dropdown">
              <option value="-1" id="native_size_name_-1">Select</option>
              <option value="0" id="native_size_name_0" class="dropdownAvailable">26W / 30L</option>
              <option value="1" id="native_size_name_1" class="dropdownUnavailable">27W / 30L</option>
              <option value="2" id="native_size_name_2" class="dropdownAvailable">28W / 30L</option>
              <option value="3" id="native_size_name_3" class="dropdownAvailable">29W / 30L</option>
              <option value="4" id="native_size_name_4" class="dropdownAvailable">30W / 30L</option>
            </select>
          </span>
        </div>
      </div>
      <div id="selectQuantity"><select name="quantity" id="quantity"><option>1</option><option>2</option><option>3</option></select></div>
      <div id="feature-bullets"><ul><li>99% Cotton, 1% Elastane</li><li>Straight leg, button fly</li></ul></div>
    </div>
    <div class="a-popover-preload" id="a-popover-pricingFeedback">
      <form>
        <fieldset id="pricingFeedback_onlineInput">
          <div id="onlineCalendar">
            <select id="onlineDay" class="day-select"><option></option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
            <select id="onlineMonth" class="month-select"><option></option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option></select>
          </div>
        </fieldset>
      </form>
    </div>
  </div>
</body>
</html>
