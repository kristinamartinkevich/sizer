<!doctype html>
<!--
  Synthetic fixture (found shopping as a plus-size persona, 2026-10-11): Whistles' product data has
  a raw line break inside a string, which is not valid JSON, so Sizer dropped all of it, the price in
  pounds included, and read Whistles' bare 04 to 20 on whistles.com as US sizes. Markup trimmed from
  Whistles' product page; the brand is fictional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Navy Double Breasted Pea Coat | MERLE | Merle UK |</title>
  <meta property="og:title" content="Navy Double Breasted Pea Coat">
  <script type="application/ld+json">
  { "@context": "http://schema.org/", "@type": "Product", "name": "Navy Double Breasted Pea Coat", "brand": "Merle",
    "description": "A double-breasted pea coat in a wool and cashmere blend.
Fully lined.",
    "offers": { "@type": "Offer", "priceCurrency": "GBP", "price": "289.00", "availability": "http://schema.org/InStock" } }
  </script>
  <style>
    body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; color: #1d1d1b; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .sizelist { display: flex; gap: 8px; list-style: none; padding: 0; }
    .sizelist li { width: 48px; height: 40px; line-height: 40px; text-align: center; border: 1px solid #1d1d1b; }
  </style>
</head>
<body>
  <main>
    <h1>Navy Double Breasted Pea Coat</h1>
    <p>£289</p>
    <section class="product-detail__attribute--size">
      <span>Select size</span>
      <ul class="sizelist" role="listbox">
        <li role="option" class="unavailable">04</li>
        <li role="option">06</li>
        <li role="option">08</li>
        <li role="option">10</li>
        <li role="option">12</li>
        <li role="option">14</li>
        <li role="option">16</li>
        <li role="option">18</li>
        <li role="option">20</li>
      </ul>
    </section>
    <p>66% wool, 28% polyamide, 6% cashmere.</p>
  </main>
</body>
</html>
