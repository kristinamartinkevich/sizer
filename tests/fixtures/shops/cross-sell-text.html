<!doctype html>
<!--
  Synthetic fixture (found shopping with an Adidas EU 40 2/3 anchor, 2026-10-11): Bershka's product
  page says little about the jeans, so Sizer read the whole page, and its "You may also like" grid
  (class cross-selling-grid) came with it. The fit note quoted another product's card: "6 Colours
  High-waist wide-leg jeans Discounted price £14". Markup trimmed from Bershka's product page; the
  brand is fictional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Low-rise straight jeans - Women | Brisa</title>
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Product", "name": "Low-rise straight jeans", "brand": { "@type": "Brand", "name": "Brisa" },
    "offers": { "@type": "Offer", "price": "35.99", "priceCurrency": "GBP" } }
  </script>
  <style>
    body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; color: #111; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .size-selector__list { display: flex; gap: 8px; }
    .size-button { width: 48px; height: 40px; border: 1px solid #111; background: #fff; }
    .cross-selling-grid__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="product-detail-info">
      <h1>Low-rise straight jeans</h1>
      <p>£35.99</p>
      <div class="size-selector">
        <p>Sizes</p>
        <div class="size-selector__list">
          <button class="size-button">06</button>
          <button class="size-button">08</button>
          <button class="size-button">10</button>
          <button class="size-button">12</button>
          <button class="size-button">14</button>
        </div>
      </div>
      <button>Add to bag</button>
    </div>
    <div class="cross-selling-grid">
      <h2>You may also like</h2>
      <section class="cross-selling-grid__grid">
        <article><a href="/gb/high-waist-wide-leg-jeans-c0p1.html">6 Colours High-waist wide-leg jeans</a><p>Discounted price £14.99</p></article>
        <article><a href="/gb/super-baggy-jeans-c0p2.html">6 Colours Super baggy jeans</a><p>£39.99</p></article>
        <article><a href="/gb/skinny-jeans-c0p3.html">4 Colours Fits small, size up skinny jeans</a><p>£29.99</p></article>

</body>
</html>
