<!doctype html>
<!--
  Synthetic fixture (found shopping as a US persona, 2026-10-11): Anthropologie's shirt sizes run XXS
  to XL, and its Size & Fit panel lists the garment's length as a bare list item, 25"L. Sizer read
  the 25 as a size, so the shirt was offered in XXS to XL and 25. Markup trimmed from Anthropologie's
  product page; the brand is fictional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mabel Boxy Oxford Shirt | Pilar</title>
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Product", "name": "Mabel Boxy Oxford Shirt", "brand": { "@type": "Brand", "name": "Pilar" },
    "offers": { "@type": "Offer", "price": "98.00", "priceCurrency": "USD" } }
  </script>
  <style>
    body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; color: #121212; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .c-pwa-radio-boxes__list { display: flex; gap: 8px; list-style: none; padding: 0; }
    .c-pwa-radio-boxes__item input { position: absolute; opacity: 0; }
    .c-pwa-radio-boxes__item label { display: block; padding: 8px 12px; border: 1px solid #121212; }
  </style>
</head>
<body>
  <main>
    <h1>Mabel Boxy Oxford Shirt</h1>
    <p>$98.00</p>
    <form class="c-pwa-sku-selection__form">
      <fieldset class="c-pwa-sku-selection__size">
        <legend>Size</legend>
        <ul class="c-pwa-radio-boxes__list">
          <li class="c-pwa-radio-boxes__item"><input type="radio" id="s1" name="size"><label for="s1">XXS</label></li>
          <li class="c-pwa-radio-boxes__item"><input type="radio" id="s2" name="size"><label for="s2">XS</label></li>
          <li class="c-pwa-radio-boxes__item"><input type="radio" id="s3" name="size"><label for="s3">S</label></li>
          <li class="c-pwa-radio-boxes__item"><input type="radio" id="s4" name="size"><label for="s4">M</label></li>
          <li class="c-pwa-radio-boxes__item"><input type="radio" id="s5" name="size"><label for="s5">L</label></li>
          <li class="c-pwa-radio-boxes__item"><input type="radio" id="s6" name="size"><label for="s6">XL</label></li>
        </ul>
      </fieldset>
    </form>
    <div class="c-pwa-size-and-fit">
      <h2>Size &amp; Fit</h2>
      <div class="c-pwa-markdown">Dimensions <ul><li>25"L</li></ul></div>
    </div>
    <p>A boxy shirt in crisp cotton oxford cloth with a relaxed shoulder.</p>
  </main>
</body>
</html>
