<!doctype html>
<!--
  Synthetic fixture (found shopping as a tall persona, 2026-10-11): another nike.com/gb page whose
  product data lists only the sizes in stock, as bare US numbers 8 to 12, while its fifteen buttons
  read "UK 2.5" to "UK 9.5" with the small ones sold out. The lists differ in length, so Sizer took
  the product data and sized in US numbers no button carries. Markup trimmed from Nike's product
  page; the brand is fictional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Strider Max Women's Road Running Shoes. Kestrel UK</title>
  <meta property="og:title" content="Strider Max Women's Road Running Shoes">
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "ProductGroup", "name": "Strider Max Women's Road Running Shoes", "brand": { "@type": "Brand", "name": "Kestrel" },
    "hasVariant": [
      { "@type": "Product", "size": "6", "offers": { "@type": "Offer", "priceCurrency": "GBP", "price": 164.99, "availability": "https://schema.org/InStock" } },
      { "@type": "Product", "size": "6.5", "offers": { "@type": "Offer", "priceCurrency": "GBP", "price": 164.99, "availability": "https://schema.org/InStock" } },
      { "@type": "Product", "size": "7", "offers": { "@type": "Offer", "priceCurrency": "GBP", "price": 164.99, "availability": "https://schema.org/InStock" } },
      { "@type": "Product", "size": "7.5", "offers": { "@type": "Offer", "priceCurrency": "GBP", "price": 164.99, "availability": "https://schema.org/InStock" } }
    ] }
  </script>
  <style>
    body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; color: #1d1d1b; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, 96px); gap: 8px; }
    .grid input { position: absolute; opacity: 0; }
    .grid label { display: block; height: 40px; line-height: 40px; text-align: center; border: 1px solid #ccc; }
    fieldset { border: 0; padding: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Strider Max</h1>
    <p>£164.99</p>
    <div id="size-selector" class="size-selector-wrapper">
      <fieldset class="pdp-grid-selector">
        <legend>Select Size</legend>
        <div class="grid">
          <div><input type="radio" id="s1" name="grid-selector-input" value="1" disabled><label for="s1">UK 2.5</label></div>
          <div><input type="radio" id="s2" name="grid-selector-input" value="2" disabled><label for="s2">UK 3</label></div>
          <div><input type="radio" id="s3" name="grid-selector-input" value="3"><label for="s3">UK 3.5</label></div>
          <div><input type="radio" id="s4" name="grid-selector-input" value="4"><label for="s4">UK 4</label></div>
          <div><input type="radio" id="s5" name="grid-selector-input" value="5"><label for="s5">UK 4.5</label></div>
          <div><input type="radio" id="s6" name="grid-selector-input" value="6"><label for="s6">UK 5</label></div>
        </div>
      </fieldset>
    </div>
    <p>A tall stack of responsive foam.</p>
  </main>
</body>
</html>
