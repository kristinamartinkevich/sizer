<!doctype html>
<!--
  Synthetic fixture (found shopping as a plus-size persona, 2026-10-11): Oh Polly's sizes are radio
  inputs named "Size-1" inside a fieldset with data-name="Size". The labels' own attributes never say
  size, and stock is marked with data-available on the input, so Sizer read no sizes at all. Markup
  trimmed from Oh Polly's product page; the brand is fictional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ainslee square neck midi dress in wine | Pelle</title>
  <meta property="og:title" content="Ainslee square neck midi dress in wine">
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Product", "name": "Ainslee square neck midi dress in wine", "brand": { "@type": "Brand", "name": "Pelle" },
    "offers": { "@type": "Offer", "price": "80.00", "priceCurrency": "EUR" } }
  </script>
  <style>
    body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; color: #1d1d1b; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .options { display: flex; gap: 8px; }
    .opt label { display: inline-block; width: 48px; height: 40px; line-height: 40px; text-align: center; border: 1px solid #1d1d1b; }
    fieldset { border: 0; padding: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Ainslee square neck midi dress in wine</h1>
    <p>€80,00</p>
    <fieldset class="prd-Options_Fieldset" data-name="Colour">
      <legend>Colour: <span>Wine</span></legend>
      <div class="opt"><input id="c-0" class="sr-only" type="radio" name="colour" value="Black"><label for="c-0" aria-label="Black"></label></div>
      <div class="opt"><input id="c-1" class="sr-only" type="radio" name="colour" value="Wine" checked><label for="c-1" aria-label="Wine"></label></div>
    </fieldset>
    <fieldset class="prd-Options_Fieldset" data-name="Size">
      <legend>Size: <span>XXS</span></legend>
      <div class="options">
        <div class="opt"><input id="s-0" class="sr-only" type="radio" name="Size-1" value="XXS" data-available="true"><label class="prd-Options_Button" for="s-0"><span>XXS</span></label></div>
        <div class="opt"><input id="s-1" class="sr-only" type="radio" name="Size-1" value="XS" data-available="true"><label class="prd-Options_Button" for="s-1"><span>XS</span></label></div>
        <div class="opt"><input id="s-2" class="sr-only" type="radio" name="Size-1" value="S" data-available="true"><label class="prd-Options_Button" for="s-2"><span>S</span></label></div>
        <div class="opt"><input id="s-3" class="sr-only" type="radio" name="Size-1" value="M" data-available="true"><label class="prd-Options_Button" for="s-3"><span>M</span></label></div>
        <div class="opt"><input id="s-4" class="sr-only" type="radio" name="Size-1" value="L" data-available="false"><label class="prd-Options_Button" for="s-4"><span>L</span></label></div>
        <div class="opt"><input id="s-5" class="sr-only" type="radio" name="Size-1" value="XL" data-available="true"><label class="prd-Options_Button" for="s-5"><span>XL</span></label></div>
      </div>
    </fieldset>
    <p>The Ainslee midi dress is crafted from buttery-soft modal with body-hugging stretch. True to size. 94% modal, 6% elastane.</p>
  </main>
</body>
</html>
