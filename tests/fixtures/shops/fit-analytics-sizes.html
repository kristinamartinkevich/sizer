<!doctype html>
<!--
  Synthetic fixture (found shopping as a UK persona, 2026-10-11): JD Sports lists a trainer's sizes as
  plain buttons in an unnamed flex row. Nothing around them says "size"; each button carries
  data-fit-analytics-select-size, the attribute of the Fit Analytics size widget, and a sold-out size
  is a disabled button. Every button also carries Tailwind's "disabled:line-through disabled:opacity-20",
  which once read as sold out on all of them. Sizer found no sizes, and the title names only the model, so the page read as
  "not clothing" and showed nothing. Markup trimmed from JD Sports' product page; the brand is fictional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>White Kestrel 530 Women's - JD Sports UK</title>
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Product", "name": "Kestrel 530 Women's", "brand": { "@type": "Brand", "name": "Kestrel" },
    "offers": { "@type": "Offer", "price": "100.00", "priceCurrency": "GBP" } }
  </script>
  <style>
    body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; color: #121212; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .flex { display: flex; flex-wrap: wrap; gap: 8px; }
    .flex button { min-width: 60px; height: 48px; border: 1px solid #121212; background: #fff; font: inherit; }
    .flex button:disabled { opacity: 0.2; text-decoration: line-through; }
  </style>
</head>
<body>
  <main>
    <h1>Kestrel 530 Women's</h1>
    <p>£100.00</p>
    <div class="mt-12">
      <div class="flex flex-wrap">
        <button class="inline-flex items-center whitespace-nowrap disabled:pointer-events-none disabled:cursor-not-allowed disabled:line-through disabled:opacity-20" data-test-id="3.5-variant" aria-pressed="false" data-fit-analytics-select-size="3.5"><span class="whitespace-nowrap">3.5</span></button>
        <button class="inline-flex items-center whitespace-nowrap disabled:pointer-events-none disabled:cursor-not-allowed disabled:line-through disabled:opacity-20" data-test-id="4-variant" aria-pressed="false" data-fit-analytics-select-size="4"><span class="whitespace-nowrap">4</span></button>
        <button class="inline-flex items-center whitespace-nowrap disabled:pointer-events-none disabled:cursor-not-allowed disabled:line-through disabled:opacity-20" data-test-id="4.5-variant" aria-pressed="false" data-fit-analytics-select-size="4.5"><span class="whitespace-nowrap">4.5</span></button>
        <button class="inline-flex items-center whitespace-nowrap disabled:pointer-events-none disabled:cursor-not-allowed disabled:line-through disabled:opacity-20" data-test-id="5-variant" aria-pressed="false" data-fit-analytics-select-size="5" disabled><span class="whitespace-nowrap">5</span></button>
        <button class="inline-flex items-center whitespace-nowrap disabled:pointer-events-none disabled:cursor-not-allowed disabled:line-through disabled:opacity-20" data-test-id="5.5-variant" aria-pressed="false" data-fit-analytics-select-size="5.5"><span class="whitespace-nowrap">5.5</span></button>
        <button class="inline-flex items-center whitespace-nowrap disabled:pointer-events-none disabled:cursor-not-allowed disabled:line-through disabled:opacity-20" data-test-id="6-variant" aria-pressed="false" data-fit-analytics-select-size="6"><span class="whitespace-nowrap">6</span></button>
        <button class="inline-flex items-center whitespace-nowrap disabled:pointer-events-none disabled:cursor-not-allowed disabled:line-through disabled:opacity-20" data-test-id="6.5-variant" aria-pressed="false" data-fit-analytics-select-size="6.5"><span class="whitespace-nowrap">6.5</span></button>
        <button class="inline-flex items-center whitespace-nowrap disabled:pointer-events-none disabled:cursor-not-allowed disabled:line-through disabled:opacity-20" data-test-id="7-variant" aria-pressed="false" data-fit-analytics-select-size="7"><span class="whitespace-nowrap">7</span></button>
      </div>
    </div>
    <p>A retro running trainer with a mesh and leather upper.</p>
  </main>
</body>
</html>
