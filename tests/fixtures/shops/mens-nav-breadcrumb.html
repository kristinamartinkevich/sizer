<!doctype html>
<!--
  Synthetic fixture (found shopping as a UK persona, 2026-10-12): River Island prints its breadcrumb
  as a list in a nav labelled "Breadcrumb", with no product data for it. Here it is the only place
  that says the jeans are men's. Markup trimmed from River Island's product page; the brand is
  fictional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blue Slim Fit Jeans | Kestrel</title>
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Product", "name": "Blue Slim Fit Jeans", "brand": { "@type": "Brand", "name": "Kestrel" },
    "offers": { "@type": "Offer", "price": "45.00", "priceCurrency": "GBP" } }
  </script>
  <style>
    body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; color: #121212; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    nav ol { display: flex; gap: 8px; list-style: none; padding: 0; font-size: 13px; }
    .size-grid { display: flex; gap: 8px; list-style: none; padding: 0; }
    .size-grid li { min-width: 48px; padding: 10px; border: 1px solid #121212; text-align: center; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><a href="/c/men">Men</a></li><li><a href="/c/men/jeans">Jeans</a></li></ol></nav>
    <h1>Blue Slim Fit Jeans</h1>
    <p>£45.00</p>
    <ul class="size-grid">
      <li>28</li>
      <li>30</li>
      <li>32</li>
      <li>34</li>
      <li>36</li>
    </ul>
    <p>Slim fit jeans in a mid blue wash. 99% cotton, 1% elastane.</p>
  </main>
</body>
</html>
