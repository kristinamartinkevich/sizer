<!doctype html>
<!--
  Synthetic fixture (found shopping as a petite persona, 2026-10-11): AllSaints fetches its sizes only
  when the size menu is opened, and its product data is a WebPage, not a Product, so Sizer decided it
  was not a product page and showed nothing. The page says so in og:type, and gives its currency as
  og:product:price:currency. Gymshark's brand carries the site's tagline, "Gymshark | We Do Gym".
  Markup trimmed from both; the brand is fictional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Berletta Velvet Maxi Dress INK BLUE | STRAND</title>
  <meta property="og:type" content="product">
  <meta property="og:title" content="Berletta Velvet Maxi Dress">
  <meta property="product:brand" content="Strand | We Make Dresses">
  <meta property="og:product:price:amount" content="259.00">
  <meta property="og:product:price:currency" content="GBP">
  <script type="application/ld+json">
  { "@context": "http://schema.org/", "@type": "WebPage", "headline": "Berletta Velvet Maxi Dress", "publisher": { "@type": "Organization", "name": "Strand UK" } }
  </script>
  <style>
    body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; color: #1d1d1b; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Berletta Velvet Maxi Dress</h1>
    <p>£259.00</p>
    <p>Regular-fit maxi dress made from a silk-blend velvet. Wide ruched straps.</p>
    <label for="size-2" hidden>Select size</label>
    <select id="size-2"><option value="Select size">Select size</option></select>
    <button type="button">Add to bag</button>
  </main>
</body>
</html>
