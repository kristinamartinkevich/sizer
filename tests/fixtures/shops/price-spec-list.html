<!doctype html>
<!--
  Synthetic fixture (found shopping as a plus-size persona, 2026-10-11): Hollister and Abercrombie
  put the currency in a list of price specifications on the offer, which Sizer did not look into, so
  pounds on a .com host never marked a UK shop. Markup trimmed from Hollister's product page; the
  brand and the pounds are fictional.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wrap midi skirt | Women's Bottoms | Tamsin</title>
  <meta property="og:title" content="Wrap midi skirt">
  <script type="application/ld+json">
  { "@context": "http://schema.org", "@type": "Product", "name": "Wrap midi skirt", "brand": "Tamsin",
    "offers": { "@type": "Offer", "availability": "http://schema.org/InStock",
      "priceSpecification": [{ "@type": "UnitPriceSpecification", "price": 45, "priceCurrency": "GBP", "priceType": "https://schema.org/ListPrice" }] } }
  </script>
  <style>
    body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; color: #1d1d1b; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .size-list { display: flex; gap: 8px; }
    .size-list button { width: 48px; height: 40px; border: 1px solid #1d1d1b; background: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Wrap midi skirt</h1>
    <p>£45</p>
    <div class="size-list">
      <button type="button">4</button>
      <button type="button">6</button>
      <button type="button">8</button>
      <button type="button">10</button>
      <button type="button" disabled>12</button>
      <button type="button">14</button>
    </div>
    <p>100% viscose.</p>
  </main>
</body>
</html>
