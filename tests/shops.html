<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sizer · shop fixtures</title>
  <!--
    Runs the page reader and the engine against saved real product pages (tests/fixtures/shops/) and
    checks what each one should read. Serve the repo (python3 tools/serve.py 8766) and open
    http://localhost:8766/tests/shops.html; the summary line at the top says PASS or FAIL.
    Captures come from tools/render-shop.py's input, saved with the page's own markup intact.
  -->
  <style>
    body { font: 14px/1.5 -apple-system, Helvetica, Arial, sans-serif; margin: 24px; color: #111; }
    h1 { font-size: 18px; } h2 { font-size: 15px; margin: 22px 0 6px; }
    .ok { color: #1a7f37; } .bad { color: #b3261e; font-weight: 600; }
    li { margin: 2px 0; } code { background: #f2f2f0; padding: 0 4px; }
    iframe { width: 1280px; height: 10px; border: 0; visibility: hidden; position: absolute; }
  </style>
</head>
<body>
  <h1 id="summary">Running…</h1>
  <div id="out"></div>
  <script src="../src/brands.js"></script>
  <script src="../src/charts-store.js"></script>
  <script src="../src/charts.js"></script>
  <script src="../src/defaults.js"></script>
  <script src="../src/review-details.js"></script>
  <script src="../src/engine.js"></script>
  <script src="../src/guide-table.js"></script>
  <script src="../src/extract.js"></script>
  <script src="../src/vinted.js"></script>
  <script src="../src/vinted-page.js"></script>
  <script>
    const PROFILE = { anchors: [{ brand: 'Zara', type: 'jeans', size: '38', fit: 'perfect' }, { brand: '', type: 'jeans', size: '27', fit: 'perfect' }], waist: '', hip: '', inseam: '', footLength: '', unit: 'cm', fitPreference: 'regular' };
    // What each saved page must yield. Stock and notes are what the page showed on the capture date.
    // `guide`: null when the page prints no size guide table, else the charts the reader must parse from it.
    // None of the four real shops carries its chart in the DOM; Revolve's two guide tables are the
    // model's measurements and the garment's dimensions, which must not parse. inline-guide and
    // aria-guide are synthetic; aria-guide is not a product page, so only its guide is checked.
    // iframe-guide and guide-link are synthetic too (fit-evidence C4): a guide in a same-origin frame,
    // and a link to the shop's own size-guide page (guide-link-page, read through fetchGuideText with
    // the fixture served in place of the shop) plus chart images. `images`: the chart images the page
    // offers; `link`: the guide link it must pick; `pageGuide`/`pageImages`: what the linked page yields.
    const SHOPS = [
      { name: 'zalando', base: 'https://www.zalando.co.uk/', brand: 'rag & bone', title: /STEVIE/, sizes: 8, soldOut: ['25', '27', '28', '29'], fitNote: 'small', size: '28', headline: /Runs small/, guide: null },
      { name: 'asos', base: 'https://www.asos.com/', brand: "Levi's", title: /501/, sizes: 17, soldOut: ['W24 L30', 'W25 L32', 'W26 L32', 'W27 L32', 'W28 L34', 'W29 L32', 'W32 L32'], fitNote: 'large', reviewsMin: 2, reviewsMax: 6, summary: /Fit is between/, size: 'W26 L30', headline: /Runs large/, guide: null },
      { name: 'nap', base: 'https://www.net-a-porter.com/', brand: 'AGOLDE', title: /straight-leg jeans/, sizes: 10, soldOut: [], fitNote: 'tts', size: '28', guide: null },
      { name: 'revolve', base: 'https://www.revolveclothing.fr/', brand: 'AGOLDE', title: /PINCH WAIST/, sizes: 12, soldOut: ['24', '25', '27', '29', '30', '31', '32', '33', '34'], reviewsMin: 3, reviewsMax: 10, noStretch: true, size: '28', guide: [], reviewer: { heightBucket: 'tall', curves: 'straight', verdict: 'small' } },
      // Synthetic: a quantity select, a "buy the look" and a "get the look" picker and recommended
      // products' size buttons beside the product's own six sizes, none of which may be read.
      { name: 'other-pickers', base: 'https://ostra.example/', brand: 'Ostra', title: /Linen midi dress/, sizes: 6, soldOut: ['UK 10'], size: 'UK 10', guide: null },
      // Synthetic: PLT and boohoo's data-test-id buttons, and SSENSE's "WAIST US 24 - Sold Out" options.
      { name: 'test-id-buttons', base: 'https://www.mardi.com/', brand: 'Mardi', title: /Slouchy wide leg jeans/, sizes: 7, soldOut: ['14'], size: '10', guide: null },
      { name: 'waist-select', base: 'https://halden.example/', brand: 'Halden', title: /Melanie straight jeans/, sizes: 9, soldOut: ['W24', 'W31', 'W32'], size: 'W28', guide: null },
      { name: 'fieldset-radios', base: 'https://eu.pelle.example/', brand: 'Pelle', title: /Ainslee square neck midi dress/, sizes: 6, soldOut: ['L'], size: 'S', guide: null },
      { name: 'select-box', base: 'https://wrenandhare.example/products/original-dungarees-dark-green', brand: 'Wren & Hare', title: /Original Straight Leg Dungarees/, sizes: 5, soldOut: ['UK 16'], lineAfter: '.select', size: 'UK 10', guide: null },
      { name: 'size-guide-link', base: 'https://www.vela.example/gb/t/ventus-run-womens-road-running-shoes-AB12/VR2543-002', brand: 'Vela', title: /Ventus Run/, sizes: 6, soldOut: [], order: ['UK 3', 'UK 3.5', 'UK 4', 'UK 4.5', 'UK 5', 'UK 5.5'], size: undefined, guide: null },
      { name: 'cross-sell-text', base: 'https://www.brisa.example/gb/low-rise-straight-jeans-c0p9.html', brand: 'Brisa', title: /Low-rise straight jeans/, sizes: 5, soldOut: [], fitNote: null, notText: /Colours/, size: '10', guide: null },
      { name: 'broken-ld', base: 'https://www.merle.com/', brand: 'Merle', title: /Navy Double Breasted Pea Coat/, sizes: 9, soldOut: ['04'], size: '10', guide: null },
      { name: 'price-spec-list', base: 'https://www.tamsin.com/', brand: 'Tamsin', title: /Wrap midi skirt/, sizes: 6, soldOut: ['12'], size: '10', guide: null },
      { name: 'dom-over-ld', base: 'https://www.kestrel.com/gb/', brand: 'Kestrel', title: /Strider Plus/, sizes: 6, soldOut: ['UK 4'], order: ['UK 2.5', 'UK 3', 'UK 3.5', 'UK 4', 'UK 4.5', 'UK 5'], size: undefined, guide: null },
      { name: 'dom-over-short-ld', base: 'https://www.kestrel.com/gb/', brand: 'Kestrel', title: /Strider Max/, sizes: 6, soldOut: ['UK 2.5', 'UK 3'], order: ['UK 2.5', 'UK 3', 'UK 3.5', 'UK 4', 'UK 4.5', 'UK 5'], size: undefined, guide: null },
      { name: 'fit-dimensions', base: 'https://www.anthropologie.example/en-gb/', brand: 'Pilar', title: /Kaya Cord/, sizes: 5, soldOut: ['24'], order: ['24', '25', '26', '27', '28'], size: '27', guide: null },
      { name: 'screen-reader-stock', base: 'https://www.urbanoutfitters.example/shop/kestrel-9060-sneaker', brand: 'Kestrel', title: /Kestrel 9060 Sneakers/, sizes: 8, soldOut: ['W 6/M 4.5', 'W 7.5/M 6', 'W 8/M 6.5', 'W 8.5/M 7'], size: undefined, guide: null },
      { name: 'listing-filters', base: 'https://www.schuh.example/womens/', brand: '', title: /Women's shoes/i, sizes: 0, soldOut: [], size: undefined, guide: null, picker: false },
      { name: 'embedded-variations', base: 'https://www.aritzia.example/us/en/product/suite-satin-dress/132095.html', brand: 'Kestrel', title: /Suite Satin Dress/, sizes: 6, soldOut: ['XS', 'L', 'XL'], order: ['2XS', 'XS', 'S', 'M', 'L', 'XL'], size: 'S', guide: null, picker: false },
      { name: 'dimension-letters', base: 'https://www.anthropologie.example/shop/mabel-boxy-oxford-shirt', brand: 'Pilar', title: /Mabel Boxy Oxford Shirt/, sizes: 6, soldOut: [], order: ['XXS', 'XS', 'S', 'M', 'L', 'XL'], size: 'S', guide: null },
      { name: 'hidden-label-text', base: 'https://www.wren.example/', brand: 'Wren', title: /The Way-High Jean/, sizes: 5, soldOut: ['24', '28'], order: ['24', '25', '26', '27', '28'], size: '27', guide: null },
      { name: 'mixed-shoe-labels', base: 'https://www.zalando.co.uk/', brand: 'Kestrel Sportswear', title: /COURT LOW/, sizes: 6, soldOut: ['6 (39)'], order: ['5', '5.5', '6 (39)', '6 (40)', '6.5', '7'], size: undefined, guide: null },
      { name: 'og-product', base: 'https://www.strand.com/', brand: 'Strand', title: /Berletta Velvet Maxi Dress/, sizes: 0, soldOut: [], isProduct: true, currency: 'GBP', size: 'UK 10', guide: null },
      { name: 'ld-unsorted-letters', base: 'https://www.maren.example/en-gb/turtleneck-in-check-merino-A1150077.html', brand: 'Maren', title: /Turtleneck in Check Merino/, sizes: 6, soldOut: ['M'], picker: false, order: ['XXS', 'XS', 'S', 'M', 'L', 'XL'], size: 'S', guide: null },
      { name: 'ld-unsorted', base: 'https://www.vesna.com/en-gb/', brand: 'Vesna', title: /Dress in Leopard Denim/, sizes: 7, soldOut: ['44'], picker: false, order: ['32', '34', '36', '38', '40', '42', '44'], size: '38', guide: null },
      { name: 'bundle-cards', base: 'https://www.lark.example/product/lark-honoured-plunge-maxi-dress_blk10031', brand: 'Lark', title: /Honoured Plunge Maxi Dress/, sizes: 8, soldOut: ['16', '18', '20', '22'], order: ['8', '10', '12', '14', '16', '18', '20', '22'], size: '10', guide: null },
      { name: 'ld-size-lists', base: 'https://www.corvo.example/', brand: 'Corvo', title: /Wide-leg mid-waist jeans/, sizes: 6, soldOut: [], picker: false, size: '10', guide: null },
      { name: 'inline-guide', base: 'https://lune-atelier.example/', brand: 'Lune Atelier', title: /Bias silk midi skirt/, sizes: 5, soldOut: ['S'], noStretch: true, size: 'M',
        guide: [{ category: 'general', unit: 'cm', mentions_brand: true, labels: ['XS', 'S', 'M', 'L', 'XL'], first: { bust: [80, 84], waist: [62, 66], hip: [88, 92], foot_length: null } }], caption: 'Lune Atelier size guide' },
      { name: 'aria-guide', base: 'https://guide-paths.example/', guideOnly: true, caption: 'Shoe size chart',
        guide: [
          { category: 'bottoms', unit: 'cm', mentions_brand: false, labels: ['S', 'M', 'L'], first: { bust: null, waist: [64, 68], hip: [90, 94], foot_length: null } },
          { category: 'shoes', unit: 'cm', mentions_brand: false, labels: ['37', '38', '39'], first: { bust: null, waist: null, hip: null, foot_length: [23.5, 23.5] } },
        ] },
      { name: 'iframe-guide', base: 'https://ostra-studio.example/', guideOnly: true, caption: 'Size guide',
        guide: [{ category: 'bottoms', unit: 'cm', mentions_brand: false, labels: ['XS', 'S', 'M', 'L'], first: { bust: null, waist: [60, 64], hip: [86, 90], foot_length: null } }] },
      { name: 'guide-link', base: 'https://guide-link.example/', guideOnly: true, guide: null,
        images: ['https://guide-link.example/files/womens-size-chart.jpg'],
        link: 'https://guide-link.example/pages/size-guide', linkPage: 'guide-link-page', linkBrand: 'Fen & Fold',
        pageGuide: [{ category: 'general', unit: 'cm', mentions_brand: true, labels: ['XS', 'S', 'M', 'L'], first: { bust: [78, 82], waist: [60, 64], hip: [86, 90], foot_length: null } }],
        pageCaption: 'Fen & Fold size guide',
        pageImages: ['https://guide-link.example/files/shoe-size-chart.png'] },
      // What "Read this page with AI" sends (C4 review): the picker's block, never the header, menu,
      // footer, dialogs or reviews; with no picker, the block around the title.
      { name: 'product-text', base: 'https://harrow-lane.example/', textOnly: true, title: 'Pleated wool trousers',
        has: [/Cut generously at the hip/, /Pure wool, no stretch/], headings: ['Pleated wool trousers', 'Details'] },
      { name: 'product-text-bare', base: 'https://ostra.example/', textOnly: true, title: 'Linen wrap dress',
        has: [/It runs long/, /room at the bust/], headings: ['Linen wrap dress'] },
    ];
    // Vinted listings (fit-evidence C5), both synthetic: read by src/vinted-page.js, answered by
    // src/vinted.js and the engine. vinted-measured has JSON-LD and data-testid rows and the seller's
    // measurements in the description; vinted-label has itemprop and label-text details only and no
    // measurements, so the label size is placed on Zara's built-in chart.
    const ROUJE_DRESS = { anchors: [{ brand: 'Rouje', type: 'dress', size: '36', fit: 'perfect', flat: { chest: 46.5, waist: 36, length: 110 } }] };
    const BODY = { anchors: [], waist: '68', hip: '102' };
    const VINTED = [
      { name: 'vinted-measured', base: 'https://www.vinted.fr/items/5012345678-robe-midi-sezane', profile: ROUJE_DRESS,
        brand: 'Sézane', size: 'S', sizeRaw: 'S / 36 / 8', kind: 'dress', condition: 'Très bon état', lang: 'fr', have: { pit: 46, length: 112 }, photos: 5,
        mode: 'measured', verdict: 'fits', line: /compared with your Rouje dress in 36/, ask: /tour de taille à plat/, notAsked: /aisselle|longueur/, body: 4 },
      { name: 'vinted-label', base: 'https://www.vinted.de/items/5098765432-zara-stoffhose', profile: BODY,
        brand: 'Zara', size: 'M', sizeRaw: 'M / 38 / 10', kind: 'trousers', condition: 'Sehr gut', lang: 'de', have: {}, photos: 2,
        mode: 'label', verdict: 'small', line: /by the label$/, ask: /^Hallo.*Bundweite.*Innenbeinlänge/, notAsked: /Gesamtlänge/, body: 2 },
      // Vinted's October 2026 markup: label and value share a class, the label first, and the size row
      // is size_familiar. The reader found no size, and took "État" for the condition.
      { name: 'vinted-current', base: 'https://www.vinted.fr/items/10269668297-jupe-paloma-wool-neuve', profile: BODY,
        brand: 'Paloma Wool', size: 'EU 36', sizeRaw: 'EU 36', kind: 'skirt', condition: 'Neuf avec étiquette', lang: 'fr', have: {}, photos: 2,
        mode: 'label', verdict: 'small', line: /by the label$/, ask: /^Bonjour.*tour de taille/, notAsked: /hanches|entrejambe/, body: 2,
        anchor: /(^| )details-list--(details|main-info)( |$)/, bare: { sizeRaw: 'EU 36', condition: 'Neuf avec étiquette' } },
    ];

    async function runVinted(shop) {
      const checks = [];
      const frame = await load(shop);
      const fdoc = frame.contentDocument;
      const host = new URL(shop.base).hostname;
      const l = SizerVintedPage.readListing(fdoc, host);
      check(checks, 'brand', l.brand === shop.brand, l.brand);
      check(checks, 'size label', l.size === shop.size && l.sizeRaw === shop.sizeRaw, `${l.size} from ${l.sizeRaw}`);
      check(checks, 'kind', l.kind === shop.kind, l.kind);
      check(checks, 'condition', l.condition === shop.condition, l.condition);
      check(checks, 'language', l.lang === shop.lang, l.lang);
      check(checks, 'seller measurements', JSON.stringify(l.have) === JSON.stringify(shop.have), JSON.stringify(l.have));
      check(checks, 'photos', l.photos.length === shop.photos && l.photos.every((u) => /^https:\/\/images1\.vinted\.net\//.test(u)), l.photos.length);
      const a = SizerVinted.answerFor(l, shop.profile, null, SizerEngine);
      check(checks, 'answer', a.mode === shop.mode && a.verdict === shop.verdict, `${a.mode} ${a.verdict}`);
      check(checks, 'line', shop.line.test(a.line), a.line);
      if (shop.mode === 'label') check(checks, 'label flag', a.flag === 'Label only, the seller has not measured it', a.flag);
      check(checks, 'seller message', shop.ask.test(a.message || '') && !shop.notAsked.test(a.message || ''), a.message);
      const body = SizerChartsStore.measurementsBody({ image_urls: l.photos, kind: l.kind }, '3f2b8c1e-6d4a-4f7b-9a1c-2e5d8f0b7c64');
      check(checks, 'photo read body', body && body.image_urls.length === shop.body && Object.keys(body).sort().join() === 'image_urls,install,kind', body && JSON.stringify(body.image_urls));
      if (shop.bare) {
        // With every itemprop and the JSON-LD gone, only the detail rows are left, and the label that
        // comes first in each row must not be taken for the value.
        fdoc.querySelectorAll('[itemprop]').forEach((el) => el.removeAttribute('itemprop'));
        fdoc.querySelectorAll('script[type="application/ld+json"]').forEach((el) => el.remove());
        const b = SizerVintedPage.readListing(fdoc, host);
        check(checks, 'rows without itemprop', b.sizeRaw === shop.bare.sizeRaw && b.condition === shop.bare.condition, `${b.sizeRaw} / ${b.condition}`);
      }
      const anchor = SizerVintedPage.anchorFor(fdoc);
      check(checks, 'line anchor', !!anchor && (shop.anchor || /(^| )details-list( |$)/).test(anchor.className), anchor && anchor.className);
      frame.remove();
      return checks;
    }

    const out = document.getElementById('out');
    const results = [];
    const check = (list, label, pass, got) => { list.push({ label, pass, got }); };

    async function load(shop) {
      const html = await fetch(`fixtures/shops/${shop.name}.html`).then((r) => r.text());
      const doc = new DOMParser().parseFromString(html.replace(/<script\b(?![^>]*(?:ld\+json|application\/json))[^>]*>[\s\S]*?<\/script>/gi, ''), 'text/html');
      const base = doc.createElement('base'); base.href = shop.base; doc.head.prepend(base);
      // Layout matters for findPicker (visibility), so the document goes into a real frame.
      const frame = document.createElement('iframe');
      document.body.appendChild(frame);
      frame.contentDocument.open(); frame.contentDocument.write('<!doctype html>' + doc.documentElement.outerHTML); frame.contentDocument.close();
      await new Promise((r) => setTimeout(r, 1200));
      return frame;
    }

    async function run(shop) {
      const checks = [];
      const frame = await load(shop);
      const fdoc = frame.contentDocument;
      if (shop.textOnly) {
        const pt = SizerExtract.productText(fdoc, SizerEngine.parseSizeLabel);
        check(checks, 'text title', pt.title === shop.title, pt.title);
        for (const re of shop.has) check(checks, `text has ${re.source}`, re.test(pt.picker), pt.picker.slice(0, 120));
        const leaked = `${pt.picker} ${pt.headings.join(' ')}`.match(/[A-Z]+MARK/g);
        check(checks, 'no header, menu, footer, dialog or review text', !leaked, leaked ? leaked.join(', ') : 'none');
        check(checks, 'text headings', JSON.stringify(pt.headings) === JSON.stringify(shop.headings), JSON.stringify(pt.headings));
        frame.remove();
        return checks;
      }
      if (shop.guideOnly) {
        guideChecks(checks, shop, SizerExtract.sizeGuideTables(fdoc, '', ''));
        if ('images' in shop) {
          const images = SizerExtract.guideImages(fdoc);
          check(checks, 'guide images', JSON.stringify(images) === JSON.stringify(shop.images), JSON.stringify(images));
        }
        if ('link' in shop) await linkChecks(checks, shop, fdoc);
        frame.remove();
        return checks;
      }
      const product = SizerExtract.extractProduct(fdoc, SizerEngine);
      check(checks, 'brand', product.brand === shop.brand, product.brand);
      check(checks, 'title', shop.title.test(product.title), product.title);
      check(checks, 'size count', product.sizes.length === shop.sizes, product.sizes.length);
      const soldOut = product.sizes.filter((s) => s.available === false).map((s) => s.label);
      check(checks, 'sold out', JSON.stringify(soldOut) === JSON.stringify(shop.soldOut), soldOut.join(', ') || 'none');
      if (shop.order) check(checks, 'size order', JSON.stringify(product.sizes.map((s) => s.label)) === JSON.stringify(shop.order), product.sizes.map((s) => s.label).join(' '));
      if ('isProduct' in shop) check(checks, 'is a product page', product.isProduct === shop.isProduct, product.isProduct);
      if (shop.currency) check(checks, 'currency', product.currency === shop.currency, product.currency);
      const signals = SizerEngine.analyzeText(product.text);
      const r = SizerEngine.recommend(PROFILE, product, null);
      if ('fitNote' in shop) check(checks, 'page fit note', (signals.fitNote || null) === shop.fitNote, signals.fitNote || 'none');
      if (shop.reviewsMin) check(checks, 'reviews read', product.reviews.length >= shop.reviewsMin && product.reviews.length <= (shop.reviewsMax || 500), `${product.reviews.length}: ${product.reviews.slice(0, 2).map((s) => s.slice(0, 60)).join(' | ')}`);
      if (shop.reviewer) {
        const found = (product.reviewCards || []).map(SizerReviewDetails.parseReview).find((d) => d.heightBucket === shop.reviewer.heightBucket && d.curves === shop.reviewer.curves && d.verdict === shop.reviewer.verdict);
        check(checks, 'reviewer details', !!found, found ? found.text.slice(0, 80) : `${(product.reviewCards || []).length} cards`);
      }
      if (shop.summary) check(checks, 'fit bar', shop.summary.test(product.reviewSummary), product.reviewSummary);
      if (shop.noStretch) check(checks, 'stretch read', /non-stretch|no stretch/i.test(product.text), /non-stretch|no stretch/i.test(product.text));
      if (shop.notText) check(checks, 'other products kept out of the text', !shop.notText.test(product.text), (product.text.match(shop.notText) || [''])[0]);
      // Some shops draw no picker until "Add to basket"; their sizes come from the product data.
      const picker = !!SizerExtract.findPicker(fdoc, SizerEngine.parseSizeLabel);
      check(checks, shop.picker === false ? 'no picker' : 'picker found', picker === (shop.picker !== false), 'picker');
      if (shop.lineAfter) {
        const at = picker && SizerExtract.lineAnchor(SizerExtract.findPicker(fdoc, SizerEngine.parseSizeLabel), SizerEngine.parseSizeLabel);
        check(checks, 'line placed below', !!at && at.matches(shop.lineAfter), at ? `${at.tagName.toLowerCase()}.${at.className}` : 'none');
      }
      check(checks, 'size', r.size === shop.size, `${r.size}: ${r.headline}`);
      if (shop.headline) check(checks, 'headline', shop.headline.test(r.headline), r.headline);
      check(checks, 'no cookie text', !/necessary cookies|accepter|cookie policy/i.test(product.text.slice(0, 2000)), product.text.slice(0, 80));
      guideChecks(checks, shop, product.shopGuide);
      frame.remove();
      return checks;
    }

    // The linked guide page goes through the real fetchGuideText, with the saved fixture served in
    // place of the shop's page, and then through guideFromHtml.
    async function linkChecks(checks, shop, fdoc) {
      const link = SizerExtract.guideLink(fdoc);
      check(checks, 'guide link', link === shop.link, link);
      const served = (url, init) => fetch(`fixtures/shops/${shop.linkPage}.html`, { credentials: init.credentials, signal: init.signal })
        .then((r) => ({ ok: r.ok, status: r.status, url, headers: r.headers, text: () => r.text() }));
      const html = await SizerGuideTable.fetchGuideText(link || shop.link, { fetch: served, pageUrl: `${shop.base}products/ribbed-knit-midi-dress` });
      const page = html ? SizerExtract.guideFromHtml(html, shop.link, shop.linkBrand) : null;
      const got = page ? page.charts.map(summary) : null;
      check(checks, 'linked guide page', JSON.stringify(got) === JSON.stringify(shop.pageGuide), JSON.stringify(got));
      check(checks, 'linked guide caption', page && page.caption === shop.pageCaption, page && page.caption);
      check(checks, 'linked guide images', page && JSON.stringify(page.images) === JSON.stringify(shop.pageImages), page && JSON.stringify(page.images));
    }

    const summary = (c) => ({ category: c.category, unit: c.unit, mentions_brand: c.mentions_brand, labels: c.rows.map((r) => r.label), first: { bust: c.rows[0].bust, waist: c.rows[0].waist, hip: c.rows[0].hip, foot_length: c.rows[0].foot_length } });

    function guideChecks(checks, shop, g) {
      if (shop.guide === null) check(checks, 'shop guide', g === null, JSON.stringify(g));
      else {
        const got = g ? g.charts.map((c) => ({ category: c.category, unit: c.unit, mentions_brand: c.mentions_brand, labels: c.rows.map((r) => r.label), first: { bust: c.rows[0].bust, waist: c.rows[0].waist, hip: c.rows[0].hip, foot_length: c.rows[0].foot_length } })) : null;
        check(checks, 'shop guide', JSON.stringify(got) === JSON.stringify(shop.guide), JSON.stringify(got));
        if ('caption' in shop) check(checks, 'guide caption', g && g.caption === shop.caption, g && g.caption);
      }
    }

    (async () => {
      let failed = 0;
      for (const shop of [...SHOPS, ...VINTED]) {
        let checks;
        try { checks = await (shop.profile ? runVinted(shop) : run(shop)); } catch (e) { checks = [{ label: 'crashed', pass: false, got: String(e.stack || e) }]; }
        const h = document.createElement('h2'); h.textContent = shop.name; out.appendChild(h);
        const ul = document.createElement('ul');
        for (const c of checks) {
          const li = document.createElement('li');
          li.className = c.pass ? 'ok' : 'bad';
          li.innerHTML = `${c.pass ? '✓' : '✗'} ${c.label} <code></code>`;
          li.querySelector('code').textContent = String(c.got);
          ul.appendChild(li);
          if (!c.pass) failed += 1;
        }
        out.appendChild(ul);
        results.push({ shop: shop.name, checks });
      }
      document.getElementById('summary').textContent = failed ? `FAIL: ${failed} check(s)` : 'PASS';
      document.getElementById('summary').className = failed ? 'bad' : 'ok';
      window.__shopResults = results;
    })();
  </script>
</body>
</html>
