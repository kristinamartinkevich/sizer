<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sizer · shop fixtures</title>
  <!--
    Runs the page reader and the engine against saved real product pages (tests/fixtures/shops/) and
    checks what each one should read. Serve the repo (python3 tools/serve.py 8766) and open
    http://localhost:8766/tests/shops.html; the summary line at the top says PASS or FAIL.
    Captures come from tools/render-shop.py's input, saved with the page's own markup intact.
  -->
  <style>
    body { font: 14px/1.5 -apple-system, Helvetica, Arial, sans-serif; margin: 24px; color: #111; }
    h1 { font-size: 18px; } h2 { font-size: 15px; margin: 22px 0 6px; }
    .ok { color: #1a7f37; } .bad { color: #b3261e; font-weight: 600; }
    li { margin: 2px 0; } code { background: #f2f2f0; padding: 0 4px; }
    iframe { width: 1280px; height: 10px; border: 0; visibility: hidden; position: absolute; }
  </style>
</head>
<body>
  <h1 id="summary">Running…</h1>
  <div id="out"></div>
  <script src="../src/brands.js"></script>
  <script src="../src/charts-store.js"></script>
  <script src="../src/charts.js"></script>
  <script src="../src/defaults.js"></script>
  <script src="../src/engine.js"></script>
  <script src="../src/guide-table.js"></script>
  <script src="../src/extract.js"></script>
  <script>
    const PROFILE = { anchors: [{ brand: 'Zara', type: 'jeans', size: '38', fit: 'perfect' }, { brand: '', type: 'jeans', size: '27', fit: 'perfect' }], waist: '', hip: '', inseam: '', footLength: '', unit: 'cm', fitPreference: 'regular' };
    // What each saved page must yield. Stock and notes are what the page showed on the capture date.
    // `guide`: null when the page prints no size guide table, else the charts the reader must parse from it.
    // None of the four real shops carries its chart in the DOM; Revolve's two guide tables are the
    // model's measurements and the garment's dimensions, which must not parse. inline-guide is synthetic.
    const SHOPS = [
      { name: 'zalando', base: 'https://www.zalando.co.uk/', brand: 'rag & bone', title: /STEVIE/, sizes: 8, soldOut: ['25', '27', '28', '29'], fitNote: 'small', size: '28', headline: /Runs small/, guide: null },
      { name: 'asos', base: 'https://www.asos.com/', brand: "Levi's", title: /501/, sizes: 17, soldOut: ['W24 L30', 'W25 L32', 'W26 L32', 'W27 L32', 'W28 L34', 'W29 L32', 'W32 L32'], fitNote: 'large', reviewsMin: 2, reviewsMax: 6, summary: /Fit is between/, size: 'W26 L30', headline: /Runs large/, guide: null },
      { name: 'nap', base: 'https://www.net-a-porter.com/', brand: 'AGOLDE', title: /straight-leg jeans/, sizes: 10, soldOut: [], fitNote: 'tts', size: '28', guide: null },
      { name: 'revolve', base: 'https://www.revolveclothing.fr/', brand: 'AGOLDE', title: /PINCH WAIST/, sizes: 12, soldOut: ['24', '25', '27', '29', '30', '31', '32', '33', '34'], reviewsMin: 3, reviewsMax: 10, noStretch: true, size: '28', guide: [] },
      { name: 'inline-guide', base: 'https://lune-atelier.example/', brand: 'Lune Atelier', title: /Bias silk midi skirt/, sizes: 5, soldOut: ['S'], noStretch: true, size: 'M',
        guide: [{ category: 'general', unit: 'cm', mentions_brand: true, labels: ['XS', 'S', 'M', 'L', 'XL'], first: { bust: [80, 84], waist: [62, 66], hip: [88, 92] } }], caption: 'Lune Atelier size guide' },
    ];
    const out = document.getElementById('out');
    const results = [];
    const check = (list, label, pass, got) => { list.push({ label, pass, got }); };

    async function load(shop) {
      const html = await fetch(`fixtures/shops/${shop.name}.html`).then((r) => r.text());
      const doc = new DOMParser().parseFromString(html.replace(/<script\b(?![^>]*ld\+json)[^>]*>[\s\S]*?<\/script>/gi, ''), 'text/html');
      const base = doc.createElement('base'); base.href = shop.base; doc.head.prepend(base);
      // Layout matters for findPicker (visibility), so the document goes into a real frame.
      const frame = document.createElement('iframe');
      document.body.appendChild(frame);
      frame.contentDocument.open(); frame.contentDocument.write('<!doctype html>' + doc.documentElement.outerHTML); frame.contentDocument.close();
      await new Promise((r) => setTimeout(r, 1200));
      return frame;
    }

    async function run(shop) {
      const checks = [];
      const frame = await load(shop);
      const fdoc = frame.contentDocument;
      const product = SizerExtract.extractProduct(fdoc, SizerEngine);
      check(checks, 'brand', product.brand === shop.brand, product.brand);
      check(checks, 'title', shop.title.test(product.title), product.title);
      check(checks, 'size count', product.sizes.length === shop.sizes, product.sizes.length);
      const soldOut = product.sizes.filter((s) => s.available === false).map((s) => s.label);
      check(checks, 'sold out', JSON.stringify(soldOut) === JSON.stringify(shop.soldOut), soldOut.join(', ') || 'none');
      const signals = SizerEngine.analyzeText(product.text);
      const r = SizerEngine.recommend(PROFILE, product, null);
      if ('fitNote' in shop) check(checks, 'page fit note', (signals.fitNote || null) === shop.fitNote, signals.fitNote || 'none');
      if (shop.reviewsMin) check(checks, 'reviews read', product.reviews.length >= shop.reviewsMin && product.reviews.length <= (shop.reviewsMax || 500), `${product.reviews.length}: ${product.reviews.slice(0, 2).map((s) => s.slice(0, 60)).join(' | ')}`);
      if (shop.summary) check(checks, 'fit bar', shop.summary.test(product.reviewSummary), product.reviewSummary);
      if (shop.noStretch) check(checks, 'stretch read', /non-stretch|no stretch/i.test(product.text), /non-stretch|no stretch/i.test(product.text));
      check(checks, 'picker found', !!SizerExtract.findPicker(fdoc, SizerEngine.parseSizeLabel), 'picker');
      check(checks, 'size', r.size === shop.size, `${r.size}: ${r.headline}`);
      if (shop.headline) check(checks, 'headline', shop.headline.test(r.headline), r.headline);
      check(checks, 'no cookie text', !/necessary cookies|accepter|cookie policy/i.test(product.text.slice(0, 2000)), product.text.slice(0, 80));
      const g = product.shopGuide;
      if (shop.guide === null) check(checks, 'shop guide', g === null, JSON.stringify(g));
      else {
        const got = g ? g.charts.map((c) => ({ category: c.category, unit: c.unit, mentions_brand: c.mentions_brand, labels: c.rows.map((r) => r.label), first: { bust: c.rows[0].bust, waist: c.rows[0].waist, hip: c.rows[0].hip } })) : null;
        check(checks, 'shop guide', JSON.stringify(got) === JSON.stringify(shop.guide), JSON.stringify(got));
        if ('caption' in shop) check(checks, 'guide caption', g && g.caption === shop.caption, g && g.caption);
      }
      frame.remove();
      return checks;
    }

    (async () => {
      let failed = 0;
      for (const shop of SHOPS) {
        let checks;
        try { checks = await run(shop); } catch (e) { checks = [{ label: 'crashed', pass: false, got: String(e.stack || e) }]; }
        const h = document.createElement('h2'); h.textContent = shop.name; out.appendChild(h);
        const ul = document.createElement('ul');
        for (const c of checks) {
          const li = document.createElement('li');
          li.className = c.pass ? 'ok' : 'bad';
          li.innerHTML = `${c.pass ? '✓' : '✗'} ${c.label} <code></code>`;
          li.querySelector('code').textContent = String(c.got);
          ul.appendChild(li);
          if (!c.pass) failed += 1;
        }
        out.appendChild(ul);
        results.push({ shop: shop.name, checks });
      }
      document.getElementById('summary').textContent = failed ? `FAIL: ${failed} check(s)` : 'PASS';
      document.getElementById('summary').className = failed ? 'bad' : 'ok';
      window.__shopResults = results;
    })();
  </script>
</body>
</html>
