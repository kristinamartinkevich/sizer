<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sizer</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 300px; padding: 16px; }
    .result { margin: 12px 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
    .big { font: 500 32px/1 Georgia, "Times New Roman", serif; }
    .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Sizer</h1>
  <p class="muted" id="profile"></p>
  <div class="result" id="result" hidden></div>
  <div class="stack">
    <button class="btn" id="show" type="button">Show my size on this page</button>
    <button class="btn ghost" id="edit" type="button">Edit my sizes</button>
  </div>
  <script src="../src/brands.js"></script>
  <script src="../src/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
